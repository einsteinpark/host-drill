<title>Next Party Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* A deliberate single dark theme: this is meant to sit next to the floor plan
   the hosts already work in all night, so every colour is painted explicitly
   and nothing is borrowed from the viewer's theme. */
:root{
  --bg:#2F343E; --chrome:#252A33; --panel:#2B3039; --row:#333945; --row-hi:#3B4250;
  --line:#3E4552; --line-soft:#363C48;
  --ink:#E9EBEF; --ink-2:#C3C8D1; --mute:#98A0AB; --faint:#727A86;
  --tbl:#9298A3; --tbl-ink:#22262E; --tbl-dim:#454B57; --tbl-dim-ink:#6B7280;
  --sel:#3C8FE8; --sel-soft:#20364E;
  --ok:#3DBE6A; --sq:#E0A83C; --bad:#E2634F; --occ:#B48BDB;
  --paid:#93DDAE; --paid-ink:#123123;   /* check dropped and settled */
  --s1:#4E7FA6; --s2:#A87545; --s3:#5E8F57; --sB:#6C7480;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  /* touch: no tap flash, no 300ms double-tap delay, no rubber-band on the page */
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.tbl,.qrow{-webkit-user-select:none;user-select:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
h1,h2{margin:0;font-weight:600}

/* ── shell ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  height:100vh;height:100dvh;   /* dvh keeps Safari's toolbars from clipping the bottom bar */
  min-height:480px}

/* top chrome */
.chrome{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--chrome);
  border-bottom:1px solid var(--line)}
.chrome .brand{display:flex;align-items:baseline;gap:9px;width:250px;flex:none}
.chrome .brand b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.chrome .brand span{font-size:11px;color:var(--faint)}
.datenav{display:flex;align-items:center;gap:8px;margin:0 auto}
.datebox{background:var(--row);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 22px;font-size:13.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.shift{background:var(--row);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 18px;font-size:12.5px;color:var(--ink-2)}
.chev{width:26px;height:26px;border-radius:var(--r);color:var(--mute);font-size:15px;line-height:1}
.chev:hover{background:var(--row);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{padding:6px 12px;font-size:12px;font-weight:500;border-right:1px solid var(--line);color:var(--mute)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--row-hi);color:var(--ink);font-weight:600}
.iconbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);
  color:var(--mute);display:grid;place-items:center}
.iconbtn:hover{background:var(--row);color:var(--ink)}

/* main */
.main{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:0}

/* queue rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-hd{display:flex;align-items:center;gap:8px;padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.rail-hd h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.rail-hd .n{margin-left:auto;font-size:11.5px;color:var(--faint)}
.rail-sub{padding:7px 13px;font-size:11px;color:var(--faint);border-bottom:1px solid var(--line-soft);
  background:#292E37}
.queue{overflow-y:auto;flex:1;min-height:0;padding:6px}
.qrow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;
  padding:8px 9px;border-radius:var(--r);border-left:3px solid transparent;background:var(--row);
  margin-bottom:5px}
.qrow .pax{font-size:14px;font-weight:700;text-align:center}
.qrow .t{font-size:11.5px;color:var(--mute)}
.qrow .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.now{background:var(--row-hi);border-left-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.qrow.walkin{border-left-color:var(--s2)}
.qrow.door{border-left-color:var(--sq);background:#3A3320;text-align:left;width:100%}
.qrow.door.over{border-left-color:var(--bad);background:#3A2521}
.qrow.door.subj{box-shadow:inset 0 0 0 1px var(--sel)}
.qrow .wt{font-size:11px;font-weight:700;color:var(--sq);white-space:nowrap}
.qrow.door.over .wt{color:var(--bad)}
.rail-split{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding:2px 6px 4px;flex:none;align-self:center}
.qrow .chip{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:3px;
  border:1px solid currentColor;white-space:nowrap}
.chip.occ{color:var(--occ)} .chip.walk{color:var(--s2)} .chip.vip{color:var(--sel)}
.qveil{padding:11px 13px;font-size:11.5px;color:var(--faint);text-align:center;
  border-top:1px dashed var(--line);margin:4px 6px 0}
.gauge{padding:10px 13px;border-top:1px solid var(--line);background:#292E37}
.gauge .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:5px}
.gauge .lab b{color:var(--ink);font-weight:600}
.gbar{height:7px;border-radius:4px;background:#3A404C;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);transition:width .2s,background .2s}

/* floor */
.floorwrap{display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto;padding:6px 0}
svg.floor{display:block;width:100%;height:auto;flex:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 16px 14px;font-size:11.5px;color:var(--faint)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tbl{cursor:pointer}
.hit{fill:transparent}
.tbl.off{cursor:not-allowed}
.tbl .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;text-anchor:middle}
.tbl .when{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-anchor:middle;font-weight:500}
.tbl:hover .body{filter:brightness(1.08)}
.tbl.off:hover .body{filter:none}
.chair{fill:var(--tbl)}
.chair.dim{fill:var(--tbl-dim)}

/* the question */
.ask{background:var(--chrome);border-top:1px solid var(--line);
  padding:13px 16px calc(15px + env(safe-area-inset-bottom));
  max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ask-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:18px;align-items:center}
.who{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:3px}
.who .clock{font-size:13px;font-weight:700;color:var(--sq)}
.who .nm{font-size:21px;font-weight:700;letter-spacing:-.02em}
.who .pax{font-size:14px;color:var(--mute)}
.stem{font-size:15px;font-weight:600;color:var(--ink-2)}
.stem em{font-style:normal;color:var(--sel)}
.acts{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;font-size:13px;
  font-weight:500;background:var(--row)}
.btn:hover:not(:disabled){background:var(--row-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--sel);border-color:var(--sel);color:#0E1A28;font-weight:700}
.btn.go:hover:not(:disabled){filter:brightness(1.1);background:var(--sel)}
.btn.no{color:var(--bad);border-color:#5A3630}
.btn.no:hover{background:#3A2521}
.held{font-size:13px;color:var(--mute)}
.held b{color:var(--ink);font-weight:600}

/* result */
.result{max-width:1180px;margin:0 auto}
.res-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.res-top .g{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.res-top .hl{font-size:15px;font-weight:600}
.res-top .sub{font-size:12.5px;color:var(--mute)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;margin-bottom:12px}
.dim .r{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px}
.dim .r b{font-weight:600}
.dim .r span{color:var(--faint)}
.dbar{height:5px;border-radius:3px;background:#3A404C;overflow:hidden}
.dbar i{display:block;height:100%}
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:5px 18px}
.notes li{font-size:11.5px;line-height:1.45;color:var(--ink-2);padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:3px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.notes li[data-k="bad"]::before{background:var(--bad)}
.notes li[data-k="warn"]::before{background:var(--sq)}
.notes li[data-k="good"]::before{background:var(--ok)}
.notes .mono{font-weight:600;color:var(--ink)}

/* iPad and anything narrower than a desktop: stack, and turn the queue into a
   horizontal strip of cards so the floor plan keeps the full screen width —
   that is what makes the tables big enough to hit with a thumb. */
@media (max-width:1120px){
  /* minmax(0,…) and min-width:0 are load-bearing: without them the horizontal
     queue's min-content width blows the grid track out past the viewport */
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);min-width:0}
  .queue,.floorwrap,.ask{min-width:0}
  /* thumb-sized controls */
  .btn{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:13.5px}
  .seg button{min-height:38px;padding:0 14px;font-size:12.5px}
  .chev{width:34px;height:34px;font-size:17px}
  .iconbtn{min-height:34px}
  .rail-hd{padding:8px 12px 6px}
  .rail-sub{padding:0 12px 6px;border-bottom:0;background:transparent}
  .queue{display:flex;align-items:stretch;gap:8px;flex:none;
    overflow-x:auto;overflow-y:hidden;padding:0 12px 10px;-webkit-overflow-scrolling:touch}
  .qrow{flex:none;width:190px;margin:0}
  .qveil{flex:none;width:170px;margin:0;padding:8px 10px;border-top:0;
    border-left:1px dashed var(--line);display:flex;align-items:center;text-align:left}
  .gauge{display:flex;align-items:center;gap:12px;padding:7px 12px}
  .gauge .lab{margin:0;flex:none;gap:10px}
  .gbar{flex:1}
  .legend{font-size:12px;gap:12px;padding:6px 14px 10px}
  .chrome{flex-wrap:wrap;row-gap:7px;padding:8px 12px}
  .chrome .brand{width:auto}
  .chrome .brand span{display:none}
  .datenav{margin-right:auto}
}
/* iPad portrait and phones: let the plan scroll sideways rather than shrink away */
@media (max-width:820px){
  /* keep the plan centred in the space it has, and let it pan sideways
     rather than shrink the tables below a thumb */
  .floorwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  svg.floor{min-width:760px}
  .ask-in{grid-template-columns:1fr}
  .acts{justify-content:flex-start}
  .datebox{padding:6px 12px}
  .shift{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="chrome">
    <div class="brand"><b>Next Party Up</b><span>host seating drill</span></div>
    <div class="datenav">
      <button class="chev" id="prevN" title="Another night">&#8249;</button>
      <div class="datebox" id="dateBox">Thursday, September 3</div>
      <span class="dot" title="Service is live"></span>
      <div class="shift" id="shiftBox">Sunday&ndash;Thursday</div>
      <button class="chev" id="nextN" title="Another night">&#8250;</button>
    </div>
    <div class="seg" role="group" aria-label="Length">
      <button data-md="quick" aria-pressed="true">Quick</button>
      <button data-md="standard" aria-pressed="false">Standard</button>
    </div>
    <div class="seg" role="group" aria-label="How busy">
      <button data-ty="slow" aria-pressed="false">Slow</button>
      <button data-ty="mid" aria-pressed="true">Mid</button>
      <button data-ty="busy" aria-pressed="false">Busy</button>
    </div>
    <button class="iconbtn" id="endBtn" style="width:auto;padding:0 11px;font-size:11.5px;font-weight:600"
      title="Stop here and score what you have done so far">End &amp; score</button>
    <button class="iconbtn mono" id="seedBtn" title="Same number, same night — give every trainee the same room" style="width:auto;padding:0 9px;font-size:11.5px">#0000</button>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="rail-hd"><h2>Coming in</h2><span class="n" id="railN"></span></div>
      <div class="rail-sub" id="railSub"></div>
      <div class="queue" id="queue"></div>
      <div class="gauge">
        <div class="lab"><span>Room</span><span><b id="gTxt">0</b> of 23 tables</span></div>
        <div class="gbar"><i id="gBar" style="width:0%"></i></div>
      </div>
    </aside>

    <div class="floorwrap">
      <svg class="floor" id="floor" viewBox="0 0 1160 430" role="img" aria-label="Dining room floor plan"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <section class="ask" id="ask"></section>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   The room, exactly as configured in GuestCenter, and the party
   mix from 1,511 seated covers in August 2026.
   ═══════════════════════════════════════════════════════════════ */
const F={
  open:17*60, close:22*60+45, last:21*60+45,
  reset:15,          // check paid, then fifteen minutes to clear and reset
  walkOut:45,        // held longer than this past their booking and they leave
  /* How long a table actually sits, by party size. The check lands somewhere in
     this range — drawn once per party, so a seed always plays the same. */
  dine:[[2,60,105],[3,75,120],[4,90,120],[6,90,150],[99,120,180]],

  tables:[
    {id:"16",seats:2,zone:"10s",x:60, y:308,w:46,h:54},
    {id:"15",seats:4,zone:"10s",x:126,y:308,w:66,h:54},
    {id:"14",seats:2,zone:"10s",x:192,y:308,w:46,h:54},
    {id:"13",seats:2,zone:"10s",x:246,y:308,w:46,h:54},
    {id:"12",seats:2,zone:"10s",x:300,y:308,w:46,h:54},
    {id:"11",seats:2,zone:"10s",x:354,y:308,w:46,h:54},
    {id:"26",seats:2,zone:"20s",x:60, y:104,w:46,h:54},
    {id:"25",seats:4,zone:"20s",x:126,y:104,w:66,h:54},
    {id:"24",seats:2,zone:"20s",x:192,y:104,w:46,h:54},
    {id:"23",seats:2,zone:"20s",x:246,y:104,w:46,h:54},
    {id:"22",seats:2,zone:"20s",x:300,y:104,w:46,h:54},
    {id:"21",seats:2,zone:"20s",x:354,y:104,w:46,h:54},
    {id:"31",seats:6,zone:"30s",x:466,y:308,w:60,h:100},
    {id:"32",seats:6,zone:"30s",x:556,y:308,w:60,h:100},
    {id:"33",seats:6,zone:"30s",x:646,y:308,w:60,h:100},
    {id:"34",seats:6,zone:"30s",x:736,y:308,w:60,h:100},
    {id:"41",seats:6,zone:"40s",x:466,y:104,w:60,h:100},
    {id:"42",seats:6,zone:"40s",x:556,y:104,w:60,h:100},
    {id:"43",seats:6,zone:"40s",x:646,y:104,w:60,h:100},
    {id:"44",seats:6,zone:"40s",x:736,y:104,w:60,h:100},
    {id:"51",seats:2,zone:"50s",x:896,y:308,w:52,h:44},
    {id:"52",seats:2,zone:"50s",x:986,y:308,w:52,h:44},
    {id:"53",seats:2,zone:"50s",x:1076,y:308,w:52,h:44},
    {id:"B1",seats:1,zone:"bar",x:854, y:112,r:17},
    {id:"B2",seats:1,zone:"bar",x:892, y:112,r:17},
    {id:"B3",seats:1,zone:"bar",x:930, y:112,r:17},
    {id:"B4",seats:1,zone:"bar",x:968, y:112,r:17},
    {id:"B5",seats:1,zone:"bar",x:1006,y:112,r:17},
    {id:"B6",seats:1,zone:"bar",x:1044,y:112,r:17},
    {id:"B7",seats:1,zone:"bar",x:1082,y:112,r:17},
    {id:"B8",seats:1,zone:"bar",x:1120,y:112,r:17}
  ],
  runs:{"10s":["16","15","14","13","12","11"],"20s":["26","25","24","23","22","21"],
        "30s":["31","32","33","34"],"40s":["41","42","43","44"],
        "50s":["51","52","53"],"bar":["B1","B2","B3","B4","B5","B6","B7","B8"]},

  /* the combination table as configured — 14/15 is deliberately not a pair */
  combos:[[["11","12"],5],[["12","13"],4],[["13","14"],4],[["15","16"],7],
          [["11","12","13"],7],[["12","13","14"],6],[["14","15","16"],9],
          [["11","12","13","14"],9],[["13","14","15","16"],12],
          [["11","12","13","14","15"],14],[["12","13","14","15","16"],14],
          [["11","12","13","14","15","16"],16],
          [["21","22"],5],[["22","23"],4],[["23","24"],4],[["25","26"],7],
          [["21","22","23"],7],[["22","23","24"],6],[["24","25","26"],9],
          [["21","22","23","24"],9],[["23","24","25","26"],12],
          [["21","22","23","24","25"],14],[["22","23","24","25","26"],14],
          [["21","22","23","24","25","26"],16]],

  /* your fill order: the middle block verbatim, the banquettes continuing
     your 21 / 12 / 23 / 14 stagger, the 50s last because they are at the door */
  wingMid:["33","42","31","44","32","41","34","43"],
  wingBanq:["21","12","23","14","22","11","24","13","26","16","25","15"],
  back:["51","52","53"],

  occasionTags:["Birthday","Anniversary","Special Occasion"],
  ends:["11","16","21","26"],

  sections:{
    1:[{name:"Server 1",key:"s1",zones:["10s","20s","30s","40s"]}],
    2:[{name:"Server 1",key:"s1",zones:["10s","20s"]},
       {name:"Server 2",key:"s2",zones:["30s","40s"]}],
    3:[{name:"Server 1",key:"s1",tables:["11","12","13","14","15","16","31","32"]},
       {name:"Server 2",key:"s2",tables:["21","22","23","24","25","26","41","42"]},
       {name:"Server 3",key:"s3",tables:["33","34","43","44"]}]
  },
  bar:{name:"Bar",key:"sB",zones:["bar","50s"]},

  nights:{
    slow:{servers:1,covers:[62,105],walkins:4,label:"Slow",
          curve:[.17,.15,.19,.17,.12,.07,.07,.06,.02,.01,.005]},
    mid :{servers:2,covers:[107,150],walkins:6,label:"Mid",
          curve:[.14,.13,.11,.11,.13,.13,.11,.10,.03,.015,.005]},
    busy:{servers:3,covers:[160,215],walkins:8,label:"Busy",
          curve:[.19,.11,.07,.10,.12,.09,.09,.09,.06,.06,.02]}
  },
  sizeMix:[[1,.062],[2,.600],[3,.126],[4,.124],[5,.044],[6,.025],[7,.009],[8,.006],[9,.002],[12,.002]],
  walkMix:[[1,.168],[2,.653],[3,.112],[4,.044],[5,.018],[6,.005]],

  lookaheadMin:30, lookaheadMax:10, spreadWindow:25
};

/* a mild pull toward the middle of the range — most tables sit near the average,
   the marathon and the in-and-out are both rarer */
function dineFor(party,r){
  const row=F.dine.find(d=>party<=d[0]);
  return row[1]+Math.round(((r()+r())/2)*(row[2]-row[1])/5)*5;
}
const T=Object.fromEntries(F.tables.map(t=>[t.id,t]));
const DINING=F.tables.filter(t=>t.zone!=="bar").map(t=>t.id);
const PRIORITY=(()=>{const o=[],A=F.wingMid.slice(),B=F.wingBanq.slice();
  while(A.length||B.length){if(A.length)o.push(A.shift());if(B.length)o.push(B.shift());}
  return o.concat(F.back,F.runs.bar);})();
const RANK=Object.fromEntries(PRIORITY.map((id,i)=>[id,i]));
const NB=(()=>{const n={};F.tables.forEach(t=>n[t.id]=[]);
  Object.values(F.runs).forEach(run=>{for(let i=0;i<run.length-1;i++){
    n[run[i]].push(run[i+1]);n[run[i+1]].push(run[i]);}});return n;})();
const OPTS=(()=>{
  const o=F.tables.map(t=>({tables:[t.id],seats:t.seats}));
  F.combos.forEach(([ids,mx])=>o.push({tables:ids.slice(),seats:mx}));
  const B=F.runs.bar;
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)o.push({tables:B.slice(i,j+1),seats:j-i+1});
  o.forEach(x=>{x.key=x.tables.join("+");x.bar=x.tables.every(t=>T[t].zone==="bar");
    x.rank=x.tables.reduce((s,t)=>s+RANK[t],0)/x.tables.length;});
  return o;})();
const BY_KEY=Object.fromEntries(OPTS.map(o=>[[...o.tables].sort().join("|"),o]));

/* ── helpers ── */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const fmt=m=>{const h=Math.floor(m/60)%24,x=m%60,hh=h%12||12;
  return hh+":"+String(x).padStart(2,"0")+(h<12?"am":"pm");};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const NAMES=["Nguyen","Okafor","Ramirez","Whitfield","Castellanos","Bergeron","Ito","Halloran",
"Adeyemi","Sandoval","Kaminski","Prasad","Delacroix","Mbeki","Reyes","Lindqvist","Oyelaran",
"Barros","Ferrante","Ashworth","Tanaka","Villalobos","Novak","Osei","Cabrera","Fitzgerald",
"Marchetti","Ibarra","Sorensen","Attah","Quintero","Rosenthal","Bhatt","Mireles","Grealish",
"Escamilla","Dubois","Yamamoto","Karimi","Solberg","Trujillo","Anand","Petrov","Coelho",
"Achebe","Beaumont","Chandra","Dlamini","Eriksen","Fontaine","Gutierrez","Hwang","Imani",
"Jovanovic","Kowalski","Laurent","Moreau","Nakamura","Ozturk","Pereira","Rossi","Suzuki"];
const TAGS=[["Birthday",.108],["Date Night",.047],["Anniversary",.026],
            ["Special Occasion",.024],["Business Meal",.006]];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September",
           "October","November","December"];

/* ═══════════════════════════ the night ═══════════════════════════ */
let N=null, S=null;

function build(seed,type,mode){
  const r=rng(seed), cfg=F.nights[type];
  const secDefs=F.sections[cfg.servers].concat([F.bar]);
  const section={};
  secDefs.forEach(s=>(s.tables||s.zones.flatMap(z=>F.runs[z])).forEach(id=>section[id]=s.key));

  const buckets=[];for(let m=F.open;m<=F.open+600;m+=30)buckets.push(m);
  const pool=[];
  buckets.forEach((m,i)=>{const n=Math.round((cfg.curve[i]||0)*120);
    for(let k=0;k<n;k++){pool.push(m);if(m+15<=F.last)pool.push(m+15);}});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  let pi=0; const used={}, cap={slow:3,mid:5,busy:6}[type];
  const pickT=()=>{for(let a=0;a<pool.length;a++){const m=pool[(pi++)%pool.length];
    if(m<=F.last&&(used[m]||0)<cap){used[m]=(used[m]||0)+1;return m;}}return null;};
  const pickS=mix=>{let x=r();for(const[s,w]of mix){x-=w;if(x<=0)return s;}return 2;};

  const bag=NAMES.slice();
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  let nm=0; const name=()=>bag[(nm++)%bag.length];

  const target=cfg.covers[0]+Math.floor(r()*(cfg.covers[1]-cfg.covers[0]+1));
  const list=[]; let cov=0, id=1, guard=0;
  while(cov<target&&guard++<600){
    const t=pickT(); if(t===null)break;
    const p=pickS(F.sizeMix);
    let tag=""; let x=r(); for(const[nme,w]of TAGS){x-=w;if(x<=0){tag=nme;break;}}
    list.push({id:"R"+id++,time:t,party:p,name:name(),tag,walkin:false,vip:r()<.05,
               dine:dineFor(p,r)});
    cov+=p;
  }
  /* a few walk-ins dropped into the flow */
  for(let i=0;i<cfg.walkins;i++){
    const t=F.open+15+Math.floor(r()*((21*60)-F.open-15)/15)*15;
    const wp=pickS(F.walkMix);
    list.push({id:"W"+(i+1),time:t,party:wp,name:name(),tag:"",walkin:true,vip:false,
               dine:dineFor(wp,r)});
  }
  list.sort((a,b)=>a.time-b.time||b.party-a.party);

  const d=new Date(2026,8,3);
  return {seed,type,mode:mode||"quick",label:cfg.label,servers:cfg.servers,secDefs,section,queue:list,
          covers:sum(list.map(x=>x.party)),
          dateStr:DAYS[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(),
          shift:cfg.servers===3?"Friday–Saturday":"Sunday–Thursday"};
}

const reset=()=>{S={i:0,seats:{},log:[],over:null,pending:[],missed:[],
                     waiting:[],subject:null,
                     clock:N.queue[0]?N.queue[0].time:F.open};};

/* ── floor state ── */
const arrival=()=>N.queue[S.i]||null;
const heldOf=id=>S.waiting.find(w=>w.p.id===id);
function cur(){
  if(S.over) return null;
  if(S.subject){ const w=heldOf(S.subject); if(w) return w.p; S.subject=null; }
  return arrival();
}
const isHeld=p=>!!(p&&heldOf(p.id));
/* how far past their booking this party still has no table */
const lateBy=p=>Math.max(0,S.clock-p.time);
function taken(){
  const o={}; F.tables.forEach(t=>o[t.id]=[]);
  Object.entries(S.seats).forEach(([pid,a])=>a.tables.forEach(t=>o[t]&&o[t].push(a)));
  return o;
}
/* a table is yours again only once the check is paid AND it has been reset */
const openAt=(bk,tid,t)=>(bk[tid]||[]).every(b=>t>=b.free);
function stateAt(bk,tid,t){
  for(const b of (bk[tid]||[])){
    if(t>=b.start&&t<b.paid) return {s:"dining",b};
    if(t>=b.paid&&t<b.free)  return {s:"paid",b};
  }
  return {s:"open"};
}
/* every seating this party could physically take at a given moment */
function fits(p,at){
  const bk=taken(), out=[];
  OPTS.forEach(o=>{ if(o.seats<p.party) return;
    if(o.tables.every(t=>openAt(bk,t,at))) out.push(o); });
  return out;
}
const reasonable=(o,p)=> o.tables.length>1 ? o.seats<=p+2 : o.seats<=p+4;
const match=ids=>ids.length?BY_KEY[[...ids].sort().join("|")]||null:null;
const isOcc=p=>F.occasionTags.includes(p.tag);
function niceness(o,party){
  if(o.bar||o.tables.some(t=>T[t].zone==="50s")) return 0;
  if(o.tables.length>1) return party>=5?1:0;
  const t=T[o.tables[0]];
  if(F.ends.includes(t.id)) return 2;
  if((t.zone==="30s"||t.zone==="40s")&&party<=t.seats-2) return 1;
  if((t.id==="15"||t.id==="25")&&party>=3) return 1;
  return 0;
}
const busyTables=()=>{const bk=taken();
  return DINING.filter(id=>!openAt(bk,id,S.clock)).length;};

/* ── the two things you can do ── */
function tapTable(tid){
  const p=cur(); if(!p) return;
  if(!openAt(taken(),tid,S.clock)) return;
  const i=S.pending.indexOf(tid);
  if(i>=0) S.pending.splice(i,1); else S.pending.push(tid);
  const o=match(S.pending);
  if(o&&o.seats>=p.party) return seatNow();
  draw();
}
function seatNow(){
  const p=cur(), o=match(S.pending); if(!p||!o||o.seats<p.party) return;
  const bk=taken();
  if(!o.tables.every(t=>openAt(bk,t,S.clock))) return;
  const held=isHeld(p);
  const paid=S.clock+p.dine, free=paid+F.reset;
  S.seats[p.id]={tables:o.tables.slice(),start:S.clock,paid,free,party:p.party,src:p};
  S.log.push({p,action:"seat",tables:o.tables.slice(),at:S.clock,dine:p.dine,
              bar:o.bar,late:lateBy(p),held});
  S.pending=[];
  if(held){ S.waiting=S.waiting.filter(w=>w.p.id!==p.id); S.subject=null; settle(false); }
  else { S.i++; settle(true); }
}

/* Hold at the door. The party stays on the list, the clock keeps running, and
   you are shown exactly how late you are on them. */
function hold(){
  const p=cur(); if(!p) return;
  if(isHeld(p)){ S.subject=null; return draw(); }      // already holding — just look away
  S.waiting.push({p,since:S.clock});
  S.log.push({p,action:"hold",at:S.clock,late:lateBy(p)});
  S.pending=[]; S.i++; settle(true);
}
function pass(){
  const p=cur(); if(!p) return;
  const held=isHeld(p);
  S.log.push({p,action:"pass",at:S.clock,had:fits(p,S.clock).length,late:lateBy(p)});
  S.pending=[];
  if(held){ S.waiting=S.waiting.filter(w=>w.p.id!==p.id); S.subject=null; settle(false); }
  else { S.i++; settle(true); }
}
/* anyone held past walkOut gives up and leaves */
function checkWalkOuts(){
  const gone=S.waiting.filter(w=>lateBy(w.p)>=F.walkOut);
  if(!gone.length) return false;
  gone.forEach(w=>{
    S.missed.push({p:w.p,at:S.clock,late:lateBy(w.p)});
    S.log.push({p:w.p,action:"walked-out",at:S.clock,late:lateBy(w.p)});
  });
  S.waiting=S.waiting.filter(w=>lateBy(w.p)<F.walkOut);
  if(S.subject&&!heldOf(S.subject)) S.subject=null;
  return true;
}

function settle(advance){
  const nx=arrival();
  if(advance&&nx) S.clock=Math.max(S.clock,nx.time);
  /* book exhausted but parties still at the door: run the clock on so tables
     free up, and let them walk out if they never do */
  if(!nx&&S.waiting.length){
    let guard=0;
    while(guard++<400){
      if(checkWalkOuts()&&(N.mode==="quick"||!S.waiting.length)) break;
      if(!S.waiting.length) break;
      if(S.waiting.some(w=>fits(w.p,S.clock).length)) break;
      if(S.clock>=F.close){ checkWalkOuts(); break; }
      S.clock+=5;
    }
  } else checkWalkOuts();

  if(S.missed.length&&N.mode==="quick"&&S.log.some(l=>l.action==="walked-out"))
    { S.over="walkout"; return draw(); }
  if(!arrival()&&!S.waiting.length){ S.over="close"; return draw(); }
  draw();
}

/* ═══════════════════════════ scoring ═══════════════════════════ */
function grade(){
  const seated=S.log.filter(l=>l.action==="seat");
  const nt={order:[],time:[],spread:[],bal:[],occ:[],walk:[]};

  /* fill order — how far past the best open table did you reach */
  let loss=0,max=0;
  seated.forEach(l=>{
    const p=l.p, chosen=match(l.tables);
    /* rebuild what was actually open at that instant from the earlier seatings */
    const before={}; F.tables.forEach(t=>before[t.id]=[]);
    seated.forEach(o2=>{ if(o2.at<l.at){const a2=S.seats[o2.p.id];
      a2.tables.forEach(t=>before[t].push(a2));} });
    const open=OPTS.filter(o=>o.seats>=p.party&&reasonable(o,p.party)
      &&o.tables.every(t=>(before[t]||[]).every(b=>l.at>=b.free)));
    if(!open.length||!chosen) return;
    open.sort((x,y)=>x.rank-y.rank);
    max+=6;
    const idx=open.findIndex(o=>o.key===chosen.key);
    loss+=idx<0?6:Math.min(6,idx);
    if(idx>=5) nt.order.push({k:"warn",t:`<b>${esc(p.name)}</b> ${fmt(l.at)} — you passed <span class="mono">${open[0].key}</span> to take <span class="mono">${chosen.key}</span>.`});
    if(l.tables.some(t=>T[t].zone==="50s")){
      const better=open.find(o=>!o.tables.some(t=>T[t].zone==="50s")&&!o.bar);
      if(better){ loss+=3; max+=3;
        nt.order.push({k:"bad",t:`<b>${esc(p.name)}</b> went to <span class="mono">${l.tables.join("+")}</span> at the door with <span class="mono">${better.key}</span> open.`});}
    }
    if(p.party<=2&&l.tables.length===1&&["15","25"].includes(l.tables[0])){
      const two=open.find(o=>o.seats===2&&!o.bar);
      if(two){ loss+=3; max+=3;
        nt.order.push({k:"warn",t:`A deuce on <span class="mono">${l.tables[0]}</span> — that is a four-top and half of your ${l.tables[0]==="15"?"15/16":"25/26"} seven.`});}
    }
  });
  const orderPct=max?1-loss/max:1;
  if(orderPct>=.85) nt.order.push({k:"good",t:"You worked the order — the visible tables filled first and the door stayed quiet."});

  /* spread — no two neighbours started together while somewhere else was open */
  let hits=0;
  seated.forEach(l=>{
    if(l.tables.every(t=>T[t].zone==="bar")) return;
    l.tables.forEach(t=>NB[t].forEach(nb=>{
      if(l.tables.includes(nb)) return;
      const other=seated.find(o=>o!==l&&o.tables.includes(nb)&&Math.abs(o.at-l.at)<=F.spreadWindow&&o.at<l.at);
      if(!other) return;
      hits++;
      nt.spread.push({k:"bad",t:`<span class="mono">${t}</span> and <span class="mono">${nb}</span> both sat around ${fmt(l.at)} — shoulder to shoulder.`});
    }));
  });
  const spreadPct=clamp(1-hits/Math.max(2,Math.round(seated.length*.28)),0,1);
  if(!hits) nt.spread.push({k:"good",t:"Nothing double-seated. Guests got air on both sides."});

  /* balance — each section against its own fair share of the room */
  const floors=N.secDefs.filter(s=>s.key!=="sB");
  const wOf=id=>T[id].seats<=2?2.0:3.4;
  const caps=floors.map(s=>sum(F.tables.filter(t=>N.section[t.id]===s.key).map(t=>wOf(t.id))));
  const capT=sum(caps)||1;
  const mine=s=>seated.filter(l=>N.section[l.tables[0]]===s.key);
  const totC=sum(floors.flatMap(s=>mine(s).map(l=>l.p.party)))||1;
  const per=floors.map((s,i)=>{const c=sum(mine(s).map(l=>l.p.party));
    return {s,c,fair:caps[i]/capT,target:Math.round(caps[i]/capT*totC),n:mine(s).length};});
  const dev=per.map(p=>Math.abs(p.c/totC-p.fair)/p.fair);
  const balPct=floors.length<2?1:clamp(1-(sum(dev)/dev.length)/.30,0,1);
  per.forEach(p=>nt.bal.push({k:Math.abs(p.c-p.target)>Math.max(6,p.target*.18)?"warn":"good",
    t:`<b>${p.s.name}</b> — ${p.c} covers over ${p.n} tables. Fair share is ${p.target}.`}));
  if(N.servers===1) nt.bal.push({k:"good",t:"One server up, so balance comes free tonight."});

  /* occasions */
  const cel=seated.filter(l=>isOcc(l.p));
  let occE=0;
  cel.forEach(l=>{
    const got=niceness(match(l.tables),l.p.party);
    if(got>=2){occE++;nt.occ.push({k:"good",t:`<b>${esc(l.p.name)}</b>'s ${l.p.tag.toLowerCase()} on <span class="mono">${l.tables.join("+")}</span> — end of the run. That is the seat.`});}
    else if(got===1){occE+=.8;nt.occ.push({k:"good",t:`<b>${esc(l.p.name)}</b>'s ${l.p.tag.toLowerCase()} on <span class="mono">${l.tables.join("+")}</span> — roomy enough.`});}
    else nt.occ.push({k:"bad",t:`<b>${esc(l.p.name)}</b> — ${l.p.tag} — landed on <span class="mono">${l.tables.join("+")}</span>. Aim for 11, 16, 21 or 26, or a whole 30s/40s table.`});
  });
  const occPct=cel.length?occE/cel.length:1;
  if(!cel.length) nt.occ.push({k:"good",t:"No birthdays or anniversaries came through."});

  /* walk-ins */
  const wl=S.log.filter(l=>l.p.walkin);
  let wE=0;
  wl.forEach(l=>{
    if(l.action==="pass"){
      if(l.had){nt.walk.push({k:"bad",t:`Turned <b>${esc(l.p.name)}</b> away at ${fmt(l.at)} with ${l.had} spot${l.had>1?"s":""} sellable.`});}
      else{wE++;nt.walk.push({k:"good",t:`<b>${esc(l.p.name)}</b> at ${fmt(l.at)} — room genuinely had nothing.${l.forced?" Nothing to answer for.":""}`});}
      return;
    }
    if(l.bar||l.tables.some(t=>T[t].zone==="50s")){wE++;
      nt.walk.push({k:"good",t:`<b>${esc(l.p.name)}</b> to ${l.bar?"the bar":"the 50s"} — keeps your prime tables for the book.`});}
    else {wE+=.65;nt.walk.push({k:"warn",t:`<b>${esc(l.p.name)}</b> took <span class="mono">${l.tables.join("+")}</span>, a prime table, on a full turn.`});}
  });
  const walkPct=wl.length?wE/wl.length:1;
  if(!wl.length) nt.walk.push({k:"good",t:"No walk-ins reached the stand."});

  /* door timing — how late you ran on the parties you held */
  const booked=S.log.filter(l=>l.action==="seat"&&!l.p.walkin);
  let tE=0;
  booked.forEach(l=>{
    const d=l.late||0;
    tE += d<=5?1 : d<=15?.8 : d<=30?.5 : .2;
    if(d>30) nt.time.push({k:"bad",t:`<b>${esc(l.p.name)}</b> sat ${d} minutes past their booking.`});
    else if(d>15) nt.time.push({k:"warn",t:`<b>${esc(l.p.name)}</b> ran ${d} minutes late.`});
  });
  S.log.filter(l=>l.action==="walked-out").forEach(l=>
    nt.time.push({k:"bad",t:`<b>${esc(l.p.name)}</b> (${l.p.party}) waited ${l.late} minutes and walked out.`}));
  /* a party that gave up and left counts against you far harder than a late
     seat — it is the one outcome you cannot apologise your way out of */
  const walked=S.log.filter(l=>l.action==="walked-out").length;
  const denom=booked.length+walked;
  const timePct=denom?clamp((tE-1.5*walked)/denom,0,1):1;
  const worst=Math.max(0,...booked.map(l=>l.late||0));
  if(timePct>=.9) nt.time.push({k:"good",t:`Everyone sat close to their booking${worst?` — worst was ${worst} minutes`:""}.`});

  const dims=[
    {name:"Fill order",   w:26,pct:orderPct, notes:nt.order},
    {name:"Door timing",  w:16,pct:timePct,  notes:nt.time},
    {name:"Spread",       w:17,pct:spreadPct,notes:nt.spread},
    {name:"Server balance",w:16,pct:balPct,  notes:nt.bal},
    {name:"Occasions",    w:13,pct:occPct,   notes:nt.occ},
    {name:"Walk-ins",     w:12,pct:walkPct,  notes:nt.walk}
  ];
  const quality=sum(dims.map(d=>d.w*d.pct));
  const reached=S.over==="close"?1:clamp((S.clock-F.open)/(F.last-F.open),0,1);
  const bookings=N.queue.filter(q=>!q.walkin).length;
  const missFrac=bookings?S.missed.length/bookings:0;
  /* Quick ends on the jam, so how far you got IS the score. Standard always runs
     to close, so what costs you there is the bookings you could not seat. */
  const total=Math.round(
      S.over==="ended" ? quality                       // stopped on purpose — judge the calls only
    : N.mode==="quick" ? quality*(0.62+0.38*reached)
    : quality*(1-0.55*missFrac));
  const g=total>=93?"A":total>=87?"A−":total>=82?"B+":total>=76?"B":total>=70?"B−":
          total>=64?"C+":total>=57?"C":total>=50?"C−":total>=40?"D":"F";
  return {dims,total,grade:g,reached,missFrac,
    waits:S.log.filter(l=>l.action==="seat"&&l.waited>0).length,
    parties:seated.length,covers:sum(seated.map(l=>l.p.party))};
}

/* ═══════════════════════════ drawing ═══════════════════════════ */
const FILL={s1:"var(--s1)",s2:"var(--s2)",s3:"var(--s3)",sB:"var(--sB)"};

function draw(){ chrome_(); rail(); floor(); ask(); }

function chrome_(){
  document.getElementById("dateBox").textContent=N.dateStr;
  document.getElementById("shiftBox").textContent=N.shift;
  document.getElementById("seedBtn").textContent="#"+String(N.seed).padStart(4,"0");
  document.querySelectorAll("[data-ty]").forEach(b=>
    b.setAttribute("aria-pressed",b.dataset.ty===N.type?"true":"false"));
  document.querySelectorAll("[data-md]").forEach(b=>
    b.setAttribute("aria-pressed",b.dataset.md===N.mode?"true":"false"));
}

function rail(){
  const p=cur();
  /* Tetris rule: you only see the next half hour, and never more than ten */
  const vis=[];
  for(let k=S.i;k<N.queue.length&&vis.length<F.lookaheadMax;k++){
    const q=N.queue[k];
    if(q.time>S.clock+F.lookaheadMin) break;
    vis.push({q,k});
  }
  const hidden=N.queue.length-S.i-vis.length;
  document.getElementById("railN").textContent=
    S.over?`${Object.keys(S.seats).length} seated`
    :S.waiting.length?`${S.waiting.length} held · ${vis.length} coming`
    :`${vis.length} showing`;
  document.getElementById("railSub").innerHTML=S.over
    ? `Service over &middot; ${sum(Object.values(S.seats).map(a=>a.party))} covers seated`
    : `Next ${F.lookaheadMin} min &middot; max ${F.lookaheadMax} &middot; ${N.mode==="quick"?"ends when full":"runs to close"}`;
  /* anyone you are holding, worst wait first — tap one to seat them */
  const door=S.waiting.slice().sort((a,b)=>lateBy(b.p)-lateBy(a.p)).map(w=>{
    const late=lateBy(w.p), hot=late>=F.walkOut-15;
    return `<button class="qrow door ${hot?"over":""} ${S.subject===w.p.id?"subj":""}" data-w="${w.p.id}">
      <span class="pax mono">${w.p.party}</span>
      <span><span class="t mono">${w.p.walkin?"walk-in":"booked "+fmt(w.p.time)}</span>
        <span class="nm">${esc(w.p.name)}</span></span>
      <span class="wt">${late}m late</span></button>`;}).join("");
  document.getElementById("queue").innerHTML=
    (door?door+`<div class="rail-split">Coming in</div>`:"")
    +(vis.length?vis.map(({q,k})=>`
      <div class="qrow ${k===S.i&&!S.over&&!S.subject?"now":""} ${q.walkin?"walkin":""}">
        <span class="pax mono">${q.party}</span>
        <span><span class="t mono">${q.walkin?"walk-in":fmt(q.time)}</span>
          <span class="nm">${esc(q.name)}</span></span>
        <span>${q.walkin?`<span class="chip walk">WALK</span>`
          :isOcc(q)?`<span class="chip occ">${esc(q.tag.split(" ")[0].toUpperCase())}</span>`
          :q.vip?`<span class="chip vip">REG</span>`:""}</span>
      </div>`).join("")
      :`<div class="qveil" style="border:0">Nothing else booked.</div>`)
    +(hidden>0?`<div class="qveil">${hidden} more later tonight — you will see them 30 minutes out</div>`:"");
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    S.subject=b.dataset.w; S.pending=[]; draw(); });

  const b=busyTables();
  document.getElementById("gTxt").textContent=b;
  const pc=Math.round(100*b/DINING.length);
  const bar=document.getElementById("gBar");
  bar.style.width=pc+"%";
  bar.style.background=pc>=87?"var(--bad)":pc>=65?"var(--sq)":"var(--ok)";
}

/* chairs down the long sides, the way the floor plan draws them */
function chairs(t,dim){
  const n=Math.max(1,Math.round(t.seats/2)), out=[];
  const cw=5,ch=Math.min(14,t.h/(n+1));
  for(let i=0;i<n;i++){
    const cy=t.y-t.h/2+(t.h/(n+1))*(i+1)-ch/2;
    out.push(`<rect class="chair ${dim?"dim":""}" x="${t.x-t.w/2-cw-1}" y="${cy}" width="${cw}" height="${ch}" rx="2"/>`);
    out.push(`<rect class="chair ${dim?"dim":""}" x="${t.x+t.w/2+1}" y="${cy}" width="${cw}" height="${ch}" rx="2"/>`);
  }
  return out.join("");
}

function floor(){
  const svg=document.getElementById("floor");
  const p=cur(), bk=taken();
  const f=p&&!S.over?fits(p,S.clock):[];
  const fitsT=new Set(f.flatMap(o=>o.tables));

  let g=`<text x="228" y="34" fill="var(--faint)" font-size="10" font-weight="600"
      letter-spacing="1.6" text-anchor="middle" font-family="Archivo">BANQUETTE</text>
    <text x="228" y="404" fill="var(--faint)" font-size="10" font-weight="600"
      letter-spacing="1.6" text-anchor="middle" font-family="Archivo">BANQUETTE</text>
    <rect x="836" y="66" width="302" height="14" rx="7" fill="#3A404C"/>
    <text x="987" y="46" fill="var(--faint)" font-size="10" font-weight="600"
      letter-spacing="1.6" text-anchor="middle" font-family="Archivo">BAR</text>
    <text x="987" y="270" fill="var(--faint)" font-size="10" font-weight="600"
      letter-spacing="1.6" text-anchor="middle" font-family="Archivo">50s &mdash; BY THE DOOR</text>
    <path d="M1104 366 v34 h-58" fill="none" stroke="#4A5160" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1050" y="418" fill="var(--faint)" font-size="10" font-weight="600"
      letter-spacing="1.6" text-anchor="middle" font-family="Archivo">ENTRANCE</text>`;

  F.tables.forEach(t=>{
    const st=stateAt(bk,t.id,S.clock);
    const sec=N.section[t.id];
    const picked=S.pending.includes(t.id);
    let fill="var(--tbl)", ink="var(--tbl-ink)", dim=false, ring="", when="";

    if(st.s==="dining"){ fill=FILL[sec]; ink="#F2F4F7"; when=fmt(st.b.start).replace(":00",""); }
    else if(st.s==="paid"){                       // check settled — back in a moment
      fill="var(--paid)"; ink="var(--paid-ink)"; dim=true;
      when=(st.b.free-S.clock)+"m"; }
    else if(p&&!S.over&&!fitsT.has(t.id)){ fill="var(--tbl-dim)"; ink="var(--tbl-dim-ink)"; dim=true; }
    if(picked){ ring=`stroke="var(--sel)" stroke-width="3"`; }

    const label=`<text class="num" x="${t.x}" y="${t.y+(when?-2:5)}" fill="${ink}">${t.id}</text>`
      +(when?`<text class="when" x="${t.x}" y="${t.y+12}" fill="${ink}" opacity=".85">${when}</text>`:"");

    if(t.zone==="bar"){
      g+=`<g class="tbl ${dim?"off":""}" data-t="${t.id}" tabindex="0" role="button"
           aria-label="Bar seat ${t.id}${st.s==="open"?"":", "+st.s}">
        <circle class="hit" cx="${t.x}" cy="${t.y}" r="${t.r+2}"/>
        <circle class="body" cx="${t.x}" cy="${t.y}" r="${t.r}" fill="${fill}" ${ring}/>
        <text class="num" style="font-size:11px" x="${t.x}" y="${t.y+4}" fill="${ink}">${t.id}</text></g>`;
    } else {
      g+=`<g class="tbl ${dim?"off":""}" data-t="${t.id}" tabindex="0" role="button"
           aria-label="Table ${t.id}, seats ${t.seats}${st.s==="open"?"":", "+st.s}">
        <rect class="hit" x="${t.x-t.w/2-3}" y="${t.y-t.h/2-6}" width="${t.w+6}" height="${t.h+12}"/>
        ${chairs(t,dim||st.s==="dining")}
        <rect class="body" x="${t.x-t.w/2}" y="${t.y-t.h/2}" width="${t.w}" height="${t.h}"
          rx="4" fill="${fill}" ${ring}/>
        ${label}</g>`;
    }
  });
  svg.innerHTML=g;
  svg.querySelectorAll("[data-t]").forEach(el=>{
    el.onclick=()=>tapTable(el.dataset.t);
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapTable(el.dataset.t);}};
  });

  document.getElementById("legend").innerHTML=
    N.secDefs.map(s=>`<span><i style="background:${FILL[s.key]}"></i>${s.name}${s.key==="sB"?" (bar + 50s)":""}</span>`).join("")
    +`<span><i style="background:var(--tbl)"></i>Open</span>
      <span><i style="background:var(--paid)"></i>Check paid &middot; back in ${F.reset}m</span>
      <span style="margin-left:auto">Fill order <span class="mono">${PRIORITY.slice(0,7).join(" ")}…</span></span>`;
}

function ask(){
  const el=document.getElementById("ask");
  if(S.over) return result(el);
  const p=cur(); if(!p) return;
  const f=fits(p,S.clock);
  const held=match(S.pending);
  const seats=S.pending.reduce((s,t)=>s+T[t].seats,0);

  el.innerHTML=`<div class="ask-in">
    <div>
      <div class="who">
        <span class="clock mono">${p.walkin?"AT THE DOOR":fmt(p.time)}</span>
        ${lateBy(p)?`<span class="chip" style="color:${lateBy(p)>=F.walkOut-15?"var(--bad)":"var(--sq)"}">${lateBy(p)}m LATE</span>`:""}
        ${isHeld(p)?`<span class="chip" style="color:var(--sq)">HOLDING</span>`:""}
        <span class="nm">${esc(p.name)}</span>
        <span class="pax">party of ${p.party}</span>
        ${p.walkin?`<span class="chip walk">WALK-IN</span>`:""}
        ${isOcc(p)?`<span class="chip occ">${esc(p.tag)}</span>`:""}
        ${p.vip?`<span class="chip vip">REGULAR</span>`:""}
      </div>
      <p class="stem">${S.pending.length
        ? `Holding <b class="mono">${S.pending.join(" + ")}</b> — ${seats} seat${seats>1?"s":""} for ${p.party}. ${held?"":"Add the next table along."}`
        : f.length ? `Where are you seating them? <em>Tap a table.</em>`
        : isHeld(p)
          ? `Still nothing that takes ${p.party}. They keep waiting — <b>${F.walkOut-lateBy(p)} minutes</b> before they give up and leave. Seat someone else, or come back the moment a check clears.`
          : `Nothing on the floor takes ${p.party} right now. <em>Hold them at the door</em> and seat them the moment a check clears.`}</p>
    </div>
    <div class="acts">
      <span class="held">${new Set(f.flatMap(o=>o.tables)).size} table${new Set(f.flatMap(o=>o.tables)).size===1?"":"s"} open</span>
      ${S.pending.length?`<button class="btn" id="aClear">Clear</button>`:""}
      ${held&&held.seats>=p.party?`<button class="btn go" id="aSeat">Seat at ${S.pending.join("+")}</button>`:""}
      ${isHeld(p)
        ? `<button class="btn" id="aBack">Leave them holding</button>`
        : `<button class="btn" id="aHold">Hold at the door</button>`}
      ${p.walkin?`<button class="btn no" id="aPass">No room</button>`:""}
    </div></div>`;
  const b=id=>document.getElementById(id);
  if(b("aClear")) b("aClear").onclick=()=>{S.pending=[];draw();};
  if(b("aSeat")) b("aSeat").onclick=seatNow;
  if(b("aPass")) b("aPass").onclick=pass;
  if(b("aHold")) b("aHold").onclick=hold;
  if(b("aBack")) b("aBack").onclick=()=>{S.subject=null;S.pending=[];draw();};
}

function result(el){
  const R=grade();
  const tone=x=>x>=.85?"var(--ok)":x>=.6?"var(--sq)":"var(--bad)";
  const miss=S.missed.length;
  const gone=S.log.filter(l=>l.action==="walked-out");
  const headline=
      S.over==="ended"   ? `Stopped at ${fmt(S.clock)}`
    : S.over==="walkout" ? `Room jammed at ${fmt(S.clock)}`
    : miss ? `Closed with ${miss} booking${miss>1?"s":""} lost`
           : `Closed with every booking seated`;
  const sub=
      S.over==="ended"   ? `Your seating calls up to here, scored on their own — ${R.parties} parties, ${R.covers} covers down.`
    : S.over==="walkout" ? `${esc(gone[0].p.name)}'s ${gone[0].p.party}-top waited ${gone[0].late} minutes and left. ${R.parties} parties and ${R.covers} covers seated first.`
    : `${R.parties} parties, ${R.covers} covers.${miss?` Lost: `
        +S.missed.slice(0,4).map(m=>esc(m.p.name)+" ("+m.p.party+")").join(", ")
        +(miss>4?" and "+(miss-4)+" more.":"."):""}`;
  el.innerHTML=`<div class="result">
    <div class="res-top">
      <span class="g" style="color:${tone(R.total/100)}">${R.grade}</span>
      <span><span class="hl">${headline}</span><br><span class="sub">${sub}</span></span>
      <span style="margin-left:auto;display:flex;gap:9px">
        <button class="btn" id="rSame">Same night again</button>
        <button class="btn go" id="rNew">New night</button></span>
    </div>
    <div class="dims">${R.dims.map(d=>`<div class="dim">
      <div class="r"><b>${d.name}</b><span class="mono">${Math.round(d.w*d.pct)}/${d.w}</span></div>
      <div class="dbar"><i style="width:${Math.round(d.pct*100)}%;background:${tone(d.pct)}"></i></div>
    </div>`).join("")}</div>
    <ul class="notes">${R.dims.flatMap(d=>d.notes.slice(0,2))
      .map(n=>`<li data-k="${n.k}">${n.t}</li>`).join("")}</ul>
  </div>`;
  document.getElementById("rSame").onclick=()=>start(N.seed,N.type,N.mode);
  document.getElementById("rNew").onclick=()=>start(null,N.type,N.mode);
}

/* ═══════════════════════════ boot ═══════════════════════════ */
let MODE="quick";
function start(seed,type,mode){
  MODE=mode||MODE;
  N=build(seed!=null?seed:Math.floor(Math.random()*9000)+1000, type||"mid", MODE);
  reset();
  const p=cur(); if(p) S.clock=p.time;
  draw();
}
document.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>start(null,b.dataset.ty));
document.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>start(null,N.type,b.dataset.md));
document.getElementById("nextN").onclick=()=>start(null,N.type);
document.getElementById("prevN").onclick=()=>start(null,N.type);
document.getElementById("endBtn").onclick=()=>{
  if(S.over) return;
  S.over="ended"; S.subject=null; S.pending=[]; draw();
};
document.getElementById("seedBtn").onclick=()=>{
  const v=prompt("Night number — same number gives every trainee the same room:",N.seed);
  if(v&&!isNaN(+v)) start(Math.floor(+v),N.type);
};
start(4821,"mid");
</script>
