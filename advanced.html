  document.getElementById("legend").innerHTML =
    night.secDefs.map(s=>`<span><i style="background:${SECFILL[s.key]};border-color:${SECINK[s.key]}"></i>${s.name}${s.key==="sB"?" (B1–B8 + 50s)":""}</span>`).join("")
    +(S.phase===2?`<span><i style="background:transparent;border-color:var(--good);border-width:2px"></i>Full turn</span>
      <span><i style="background:transparent;border-color:var(--warn);border-width:2px;border-style:dashed"></i>Squeeze only</span>`:"")
    +`<span style="margin-left:auto;color:var(--faint)">Fill order <span class="mono">${PRIORITY.slice(0,8).join(" ")}…</span></span>`;
}

function biggestGap(tid){
  const list=bookings(null)[tid]||[];
  if(!list.length) return null;
  let cur=CONFIG.serviceStart,best=null;
  const push=(a,b)=>{const l=b-a; if(l>=CONFIG.squeezeMin&&(!best||l>best.len)) best={at:a,len:l};};
  list.forEach(b=>{ push(cur,b.start-CONFIG.reset); cur=b.end+CONFIG.reset; });
  push(cur,CONFIG.lastSeating);
  return best;
}

/* ── the question ─────────────────────────────────────────────────── */
const STATE_COPY={
  ready:["All here","Whole party is at the door, on time."],
  late :["Running late","They booked earlier than this."],
  inc  :["Part of the party","The rest are still coming."],
  early:["Early","They are ahead of their booking."],
  walk :["Walk-in","No reservation."]
};
function renderQuiz(){
  const host=document.getElementById("quiz");
  if(!streaming()||S.phase!==2||!S.cur){ host.innerHTML=""; host.style.display="none"; return; }
  host.style.display="";
  const e=S.cur, d=doorOf(e.id), src=srcOf(e.id);
  const st=doorState(e.id,S.clock), [stName,stWhy]=STATE_COPY[st];
  const o=placeOptions(e.id);
  const canSeat=o.full.length+o.sq.length>0;
  const waited=waitedBy(e.id,S.clock);
  const also=alsoWaiting();
  const total=night.reservations.length+night.walkins.length;
  const doneN=Object.values(S.door).filter(x=>x.seated||x.gone).length;

  let sub;
  if(st==="inc")   sub=`<b>${d.present} of ${src.party}</b> here &middot; booked ${fmt(src.time)} &middot; the last ${src.party-d.present===1?"one is":(src.party-d.present)+" are"} still coming`;
  else if(st==="late") sub=`Booked <b>${fmt(src.time)}</b> &middot; <b>${src.arriveAt-src.time} minutes late</b>`;
  else if(st==="early")sub=`Booked <b>${fmt(src.time)}</b> &middot; <b>${src.time-S.clock} minutes early</b>`;
  else if(st==="walk") sub=`No booking &middot; ${new Set(o.full.flatMap(x=>x.tables)).size} table${o.full.length===1?"":"s"} free for a full turn, ${new Set(o.sq.flatMap(x=>x.tables)).size} on a squeeze`;
  else sub=`Booked <b>${fmt(src.time)}</b> &middot; all ${src.party} at the door`;
  if(waited>0) sub+=` &middot; <b style="color:var(--bad)">waiting ${waited} min</b>`;

  let opts;
  if(S.step==="place"){
    const opt=matchOption(S.pending);
    const seats=S.pending.reduce((s,t)=>s+T[t].seats,0);
    const ok=opt&&opt.seats>=src.party;
    opts=`<div class="placebar">
      <span class="t">${S.pending.length
        ? `<span class="mono">${S.pending.join(" + ")}</span> — ${seats} seat${seats>1?"s":""} for a party of ${src.party}${opt?"":" · not a legal combination"}`
        : `Tap the table on the floor plan. Solid outline is a full turn, dashed amber is a squeeze.`}</span>
      <span class="sp"></span>
      ${S.pending.length?`<button class="btn" id="qClear">Clear</button>`:""}
      <button class="btn primary" id="qConfirm" ${ok?"":"disabled"}>Seat at ${S.pending.join("+")||"…"}</button>
      <button class="btn ghost" id="qBack">Back</button></div>`;
  } else {
    const holdLabel = st==="inc" ? "Hold for the rest of the party"
                    : st==="early" ? `Hold until ${fmt(src.time)}`
                    : "Hold at the door";
    const holdWhy = st==="inc" ? "You will be asked again when they are all here."
                  : st==="early" ? "You will be asked again at their booking time."
                  : `You will be asked again in ${CONFIG.recheck} minutes.`;
    opts=`<div class="opts">
      <button class="opt go" id="qSeat" ${canSeat?"":"disabled"}>
        <span class="k">Seat them now</span>
        <span class="d">${canSeat?`Then pick the table — ${new Set(o.full.flatMap(x=>x.tables)).size} open, ${new Set(o.sq.flatMap(x=>x.tables)).size} squeeze`:"Nothing on the floor fits right now"}</span></button>
      <button class="opt" id="qHold">
        <span class="k">${holdLabel}</span><span class="d">${holdWhy}</span></button>
      <button class="opt warn" id="qAway">
        <span class="k">Turn them away</span>
        <span class="d">${d.kind==="walkin"?"No room tonight.":"They lose the table."}</span></button></div>`;
  }

  host.innerHTML=`<div class="quiz">
    <div class="quiz-top">
      <span class="clock mono">${fmt(S.clock)}</span>
      <span class="of">Party ${doneN+1} of ${total}</span>
      ${also?`<span class="also">${also} more waiting at the door</span>`:""}
    </div>
    <div class="quiz-body">
      <div class="guest">
        <span class="nm">${esc(src.name)}</span>
        <span class="sz">party of ${src.party}</span>
        <span class="state ${st}">${stName}</span>
        ${src.tag?`<span class="state ${isCelebration(src)?"inc":"early"}">${esc(src.tag)}</span>`:""}
        ${src.vip?`<span class="state early">${esc(src.vip)}</span>`:""}
      </div>
      <p class="guest-sub">${sub}</p>
      <p class="stem">${S.step==="place"
        ? `Where are you seating ${esc(src.name)}?`
        : `${esc(src.name)} is at the stand. What do you do?`}</p>
      ${opts}
    </div></div>`;

  const b=id=>document.getElementById(id);
  if(S.step==="place"){
    if(b("qClear")) b("qClear").onclick=()=>{S.pending=[];render();};
    b("qConfirm").onclick=doorConfirm;
    b("qBack").onclick=()=>{S.step="decide";S.pending=[];render();};
  } else {
    if(canSeat) b("qSeat").onclick=doorSeat;
    b("qHold").onclick=()=>doorHold(st);
    b("qAway").onclick=doorTurnAway;
  }
}

function renderAssignBar(){
  const el=document.getElementById("assignbar");
  if(streaming()&&S.phase===2){ el.innerHTML=`<span class="msg">${CONFIG.modes[night.mode].blurb}</span>
    <span class="spacer"></span><span class="msg" style="color:var(--muted)">Seated ${S.seatedCount} &middot; ${S.walkedOut.length} walked out</span>`; return; }
  if(S.phase===3){
    el.innerHTML=`<span class="msg">Service is over. Read the scorecard, then open the model fill to compare.</span>
      <span class="spacer"></span><button class="btn primary" id="again">Run another night</button>`;
    document.getElementById("again").onclick=()=>newNight(); return;
  }
  if(S.phase===2){
    const w=currentWalkin(); if(!w){ el.innerHTML=""; return; }
    const seats=S.pending.reduce((s,t)=>s+T[t].seats,0);
    const opt=matchOption(S.pending);
    el.innerHTML=`<span class="msg">${S.pending.length
      ? `Holding <b class="mono">${S.pending.join(" + ")}</b> — ${seats} seat${seats>1?"s":""} for ${w.party}${opt?"":" · not a legal combination"}`
      : `Seat <b>${esc(w.name)}</b>, party of ${w.party}. Solid outline takes a full turn; dashed amber is a squeeze — say the time out loud.`}</span>
      <span class="spacer"></span>
      ${S.pending.length?`<button class="btn" id="clearP">Clear</button>`:""}
      <button class="btn danger" id="decline">No room — turn them away</button>`;
    const c=document.getElementById("clearP"); if(c)c.onclick=()=>{S.pending=[];render();};
    document.getElementById("decline").onclick=declineWalkin; return;
  }
  const left=night.reservations.filter(r=>!S.assign[r.id]).length;
  const res=S.selected?night.reservations.find(r=>r.id===S.selected):null;
  const seats=S.pending.reduce((s,t)=>s+T[t].seats,0);
  el.innerHTML=`<span class="msg">${
    res?(S.pending.length
      ? `<b class="mono">${S.pending.join(" + ")}</b> — ${seats} of ${res.party} seats. Add the next table along.`
      : `<b>${esc(res.name)}</b>, ${res.party} at ${fmt(res.time)}${res.tag?` — <b style="color:${isCelebration(res)?"var(--s2)":"var(--muted)"}">${esc(res.tag)}</b>`:""}${res.vip?` — <b style="color:var(--pick)">${esc(res.vip)}</b>`:""} — ${CONFIG.turn(res.party,false)} minute turn. Click a table.`)
    : left ? `Pick a reservation. Click a seated one to pull it back off the floor.`
           : `Whole book is down. Check your open windows, then run service.`}</span>
    <span class="spacer"></span>
    ${S.pending.length?`<button class="btn" id="clearP">Clear</button>`:""}
    <button class="btn" id="autofill">Fill the rest for me</button>
    <button class="btn primary" id="go" ${left?"disabled":""}>Run service &rarr;</button>`;
  const c=document.getElementById("clearP"); if(c)c.onclick=()=>{S.pending=[];render();};
  document.getElementById("autofill").onclick=()=>{
    S.assign=modelPlan(true);       // plans around what you have already seated
    S.selected=null;S.pending=[];render();
  };
  document.getElementById("go").onclick=startService;
}

function sectionStats(){
  const seated=night.reservations.filter(r=>S.assign[r.id]);
  const rows=night.secDefs.map(sec=>{
    const mine=seated.filter(r=>night.section[S.assign[r.id].tables[0]]===sec.key);
    return {sec,cov:sum(mine.map(r=>r.party)),n:mine.length};
  });
  const max=Math.max(1,...rows.map(r=>r.cov));
  return rows.map(r=>`<div style="margin-bottom:9px">
    <div class="stat" style="border:0;padding:0 0 2px">
      <span class="k" style="color:${SECINK[r.sec.key]};font-weight:600">${r.sec.name}</span>
      <span class="v mono">${r.cov} cov · ${r.n} tbl</span></div>
    <div class="bar"><i style="width:${Math.round(100*r.cov/max)}%;background:${SECINK[r.sec.key]}"></i></div></div>`).join("");
}

/* who is standing at the door, and what is coming next */
function renderDoorPanel(el){
  const waiting=S.queue.filter(q=>q.t<=S.clock&&!doorOf(q.id).seated&&!doorOf(q.id).gone)
    .map(q=>q.id).filter(id=>!S.cur||id!==S.cur.id);
  const soon=night.reservations.filter(r=>!doorOf(r.id).seated&&!doorOf(r.id).gone
      &&(!S.cur||r.id!==S.cur.id)&&r.arriveAt>S.clock)
    .sort((a,b)=>a.arriveAt-b.arriveAt).slice(0,7);
  const row=id=>{
    const d=doorOf(id),src=srcOf(id),st=doorState(id,S.clock),wt=waitedBy(id,S.clock);
    return `<div class="dr ${st}"><div><div class="nm">${esc(src.name)} · ${src.party}</div>
      <div class="sub">${st==="inc"?`${d.present} of ${src.party} here`
        :st==="late"?`booked ${fmt(src.time)}`
        :st==="walk"?"walk-in":`booked ${fmt(src.time)}`}</div></div>
      <div class="w">${wt>0?wt+"m":"—"}</div></div>`;
  };
  el.innerHTML=`
    <div class="card"><div class="card-hd"><h2>At the door</h2>
      <span class="count">${waiting.length} waiting</span></div>
      <div class="door">${waiting.length?waiting.map(row).join(""):`<div class="door-empty">Nobody else waiting.</div>`}</div></div>

    <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Coming up</h2></div>
      <div class="door">${soon.length?soon.map(r=>
        `<div class="dr"><div><div class="nm">${esc(r.name)} · ${r.party}</div>
         <div class="sub">booked ${fmt(r.time)}${r.tag?" · "+esc(r.tag):""}</div></div>
         <div class="w" style="color:var(--muted)">${fmt(r.arriveAt)}</div></div>`).join("")
        :`<div class="door-empty">That's the whole book.</div>`}</div></div>

    <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Sections</h2></div>
      <div class="card-bd">${sectionStats()}</div></div>

    <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Tonight</h2></div><div class="card-bd">
      <div class="stat"><span class="k">Seated</span><span class="v mono">${S.seatedCount}</span></div>
      <div class="stat"><span class="k">Walked out</span><span class="v mono" style="color:${S.walkedOut.length?"var(--bad)":"inherit"}">${S.walkedOut.length}</span></div>
      <div class="stat"><span class="k">Celebrations</span><span class="v mono">${night.reservations.filter(isCelebration).length}</span></div>
    </div></div>`;
}

function renderSide(){
  const el=document.getElementById("side");
  if(S.phase===3){ el.innerHTML=scorecardHTML(); return; }
  if(S.phase===2){
    if(streaming()) return renderDoorPanel(el);
    const w=currentWalkin(), done=S.wDecisions.length, tot=night.walkins.length;
    const o=w?walkinOptions(w):null;
    el.innerHTML=`${w?`<div class="walkin">
      <div class="hd"><span class="time mono">${fmt(w.time)}</span><span class="lbl">Walk-in ${done+1} of ${tot}</span></div>
      <div class="body">A party of <b>${w.party}</b> under <b>${esc(w.name)}</b> at the stand, no reservation.</div>
      <div class="body" style="margin:0"><span class="pill ok">${o.full.length} full turn${o.full.length===1?"":"s"}</span>
      <span class="pill sq">${o.sq.length} squeeze${o.sq.length===1?"":"s"}</span></div></div>`:""}
      <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Sections</h2></div>
      <div class="card-bd">${sectionStats()}</div></div>
      ${S.wDecisions.length?`<div class="card" style="margin-top:12px"><div class="card-hd"><h2>Your calls</h2></div>
        <div class="card-bd"><ul class="notes">${S.wDecisions.map(d=>
          `<li data-k="${d.action==="decline"?(d.had?"bad":"good"):"good"}">${fmt(d.w.time)} · ${d.w.party}-top —
          ${d.action==="decline"?"turned away":`<span class="mono">${d.tables.join("+")}</span>${d.squeeze?` <span class="pill sq">${d.win}m</span>`:""}`}</li>`
        ).join("")}</ul></div></div>`:""}`;
    return;
  }
  const seated=night.reservations.filter(r=>S.assign[r.id]);
  const gaps=CONFIG.tables.map(t=>({id:t.id,g:biggestGap(t.id)})).filter(x=>x.g).sort((a,b)=>b.g.len-a.g.len);
  el.innerHTML=`
    <div class="card"><div class="card-hd"><h2>Tonight</h2></div><div class="card-bd">
      <div class="stat"><span class="k">Type</span><span class="v">${night.label}</span></div>
      <div class="stat"><span class="k">On the floor</span><span class="v">${night.servers} + bar</span></div>
      <div class="stat"><span class="k">Covers booked</span><span class="v mono">${night.covers}</span></div>
      <div class="stat"><span class="k">Walk-ins expected</span><span class="v mono">${night.walkins.length}</span></div>
      <div class="stat"><span class="k">Celebrations</span><span class="v mono">${night.reservations.filter(isCelebration).length}</span></div>
      <div class="stat"><span class="k">Planned</span><span class="v mono">${seated.length}/${night.reservations.length}</span></div>
      <div class="bar"><i style="width:${Math.round(100*seated.length/night.reservations.length)}%;background:var(--ink)"></i></div>
    </div></div>
    <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Sections</h2></div>
      <div class="card-bd">${sectionStats()}</div></div>
    <div class="card" style="margin-top:12px"><div class="card-hd"><h2>Up-by windows</h2>
      <span class="count">${gaps.length} spot${gaps.length===1?"":"s"}</span></div><div class="card-bd">
      ${gaps.length?`<ul class="notes">${gaps.slice(0,7).map(x=>
        `<li data-k="${x.g.len>=100?"good":"warn"}"><span class="mono">${x.id}</span> — ${x.g.len} min from ${fmt(x.g.at)}${x.g.len<=CONFIG.squeezeMax?" · sell it as a squeeze":""}</li>`).join("")}</ul>`
      :`<p style="font-size:12px;color:var(--muted);margin:2px 0">Seat some reservations first — windows open up between the blocks you create.</p>`}
      <div class="callout">A ${CONFIG.squeezeMin}–${CONFIG.squeezeMax} minute window is the one you sell out loud:
      <em>"I can squeeze you in — I'd just need the table back by 7:45."</em> The bar takes the rest.</div>
    </div></div>`;
}

function renderTimeline(){
  const el=document.getElementById("timeline");
  const span=CONFIG.serviceEnd-CONFIG.serviceStart, pct=m=>100*(m-CONFIG.serviceStart)/span;
  const bk=bookings(null), ticks=[];
  for(let m=CONFIG.serviceStart;m<CONFIG.serviceEnd;m+=60) ticks.push(m);
  let html=`<div class="tl-row head"><div class="tl-name lbl">Table</div>
    <div class="tl-lane">${ticks.map(m=>`<div class="tl-tick mono">${fmtShort(m)}</div>`).join("")}</div></div>`;
  const ZONES=[["20s","Banquette — 20s"],["10s","Banquette — 10s"],["40s","Middle — 40s"],
               ["30s","Middle — 30s"],["50s","50s — by the door"],["bar","Bar"]];
  ZONES.forEach(([z,label])=>{
    html+=`<div class="tl-row zone"><div class="tl-name">${label}</div><div class="tl-lane"></div></div>`;
    CONFIG.runs[z].forEach(id=>{
      const t=T[id], sec=night.section[id];
      const blocks=(bk[id]||[]).map(b=>{
        const lab=b.kind==="walkin"?"WALK "+b.src.party:b.src.name.slice(0,8)+" "+b.src.party;
        return `<div class="blk ${b.kind==="walkin"?"walk":""}"
          style="left:${pct(b.start)}%;width:${pct(b.end)-pct(b.start)}%;background:${SECINK[sec]}"
          title="${esc(b.src.name)} · ${b.src.party} · ${fmt(b.start)}–${fmt(b.end)}">${esc(lab)}</div>`;}).join("");
      let gapEl="";
      const gp=biggestGap(id);
      if(gp&&S.phase!==3) gapEl=`<div class="gap" style="left:${pct(gp.at)}%;width:${pct(gp.at+gp.len)-pct(gp.at)}%">${gp.len}m</div>`;
      html+=`<div class="tl-row"><div class="tl-name mono">${id}<small>${t.seats} top</small></div>
        <div class="tl-lane">${gapEl}${blocks}</div></div>`;
    });
  });
  el.innerHTML=html;
}

function scorecardHTML(){
  const R=S.report;
  const tone=p=>p>=.85?"var(--good)":p>=.6?"var(--warn)":"var(--bad)";
  const head=R.total>=87?"You can run this room."
    :R.total>=76?"Solid plan with a few soft spots."
    :R.total>=60?"The room got filled, but not in an order that helps anyone."
    :"Go again — this fill would hurt the servers and the guests.";
  return `<div class="card"><div class="score-hero">
    <div class="g" style="color:${tone(R.total/100)}">${R.grade}</div>
    <div class="p"><span class="mono">${R.total}</span> / 100 · ${night.label}, seed <span class="mono">#${night.seed}</span></div>
    <div class="p" style="margin-top:7px;color:var(--ink-2)">${head}</div>
    ${R.unseated?`<div class="p" style="color:var(--bad)">${R.unseated} reservation${R.unseated>1?"s":""} never reached the floor.</div>`:""}
    </div><div class="card-bd">
    ${R.dims.map(d=>`<div class="dim">
      <div class="r"><span class="k">${d.name}</span><span class="v mono">${Math.round(d.weight*d.pct)}/${d.weight}</span></div>
      <div class="bar"><i style="width:${Math.round(d.pct*100)}%;background:${tone(d.pct)}"></i></div>
      <ul class="notes">${d.notes.slice(0,4).map(n=>`<li data-k="${n.k}">${n.t}</li>`).join("")}</ul></div>`).join("")}
    <details class="model"><summary>Compare with a model fill</summary>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0">Large parties placed first onto their
      combinations, then the rest in time order — each pick weighed on visibility, spread, pacing and size fit.</p>
      <div class="scroll"><table><thead><tr><th>Guest</th><th>Time</th><th>Pax</th><th>You</th><th>Model</th></tr></thead>
      <tbody>${night.reservations.map(r=>{
        const you=S.assign[r.id]?S.assign[r.id].tables.join("+"):"—";
        const m=R.model[r.id]?R.model[r.id].tables.join("+"):"—";
        return `<tr><td>${esc(r.name)}</td><td class="mono">${fmt(r.time)}</td><td class="mono">${r.party}</td>
          <td class="mono">${you}</td><td class="mono ${you!==m?"diff":""}">${m}</td></tr>`;}).join("")}</tbody></table></div>
    </details></div></div>`;
}

/* ═══════════════════════════════════════════ boot */
let forcedType=null, MODE="easy";
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  MODE=b.dataset.mode; newNight();
});
function newNight(seed){
  night=genNight(seed!=null?seed:Math.floor(Math.random()*9000)+1000, forcedType, MODE);
  resetState();
  if(streaming()) startService();      // no pre-planning: you are at the door from the first party
  else render();
}
document.querySelectorAll("[data-gen]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-gen]").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  forcedType=b.dataset.gen==="random"?null:b.dataset.gen;
  newNight();
});
document.getElementById("newNight").onclick=()=>newNight();
document.getElementById("seedBtn").onclick=()=>{
  const v=prompt("Night seed — give every trainee the same number and they get the same room:",night.seed);
  if(v&&!isNaN(+v)) newNight(Math.floor(+v));
};
document.getElementById("windowsBtn").onclick=()=>{S.showWindows=!S.showWindows;render();};

document.getElementById("foot").innerHTML=
  `<b>Built on August 2026.</b> 1,511 seated parties. Volume tiers, arrival curves, party mix and walk-in rate
   (22.5% of all business) come straight from the book; seat counts are the largest party each table actually took;
   sections are read off the Server column, where the bar covers B1–B8 plus 51/52/53.
   <br><b>Fill order</b> <code>${PRIORITY.slice(0,20).join(" ")}</code> — the middle-block half is yours verbatim;
   the banquette half continues your 21/12/23/14 stagger and holds 15, 25, 16 and 26 back for the 15/16 and 25/26 sevens.
   <br><b>Turn times</b> <code>1–2: 70m</code> <code>3–4: 85m</code> <code>5–6: 100m</code> <code>7–9: 115m</code>
   <code>bar: 50m</code>, <code>10m</code> reset, squeeze window <code>60–90m</code> — <b>the one thing August
   cannot tell us</b>: the export has no departure time. These are set so the room's throughput matches what it
   actually did. Give me your real turns and the whole drill re-tunes.
   <br><b>Occasions</b> Birthday, Anniversary and Special Occasion reach for <code>11</code> <code>16</code>
   <code>21</code> <code>26</code> — the ends of the banquette runs, open on one side instead of wedged between
   two deuces — or a two-top given a whole 30s/40s table when the room can afford it. Never the 50s, never the bar.
   Scored softly: it only counts against you when something nicer was actually free. Date Night is tagged but not
   scored; say the word and it joins them.
   <br><b>The door is beside 53</b>, so the 50s are the first thing a guest sees and the last thing you should
   sell — 51 sits deepest in, 53 is on the mat. Note that 16 and 26 are the far end of the room: late in the fill
   order for an ordinary deuce, but the right seat for an anniversary. Both rules are true at once.
   <br><b>Difficulty</b> <code>Easy</code> is the book in order — plan the whole night, then take walk-ins.
   <code>Medium</code> and <code>Hard</code> put you at the door instead: one party at a time, and every one is a
   question. Medium jumbles the order and adds early and late arrivals; Hard adds part-parties
   (<b style="color:var(--inc)">pink</b>, showing how many are actually here), heavier lateness
   (<b style="color:var(--late)">yellow</b>, +5 to +30 minutes) and two parties hitting the stand at once.
   <b style="color:var(--ready)">Purple</b> is all here and checked in. Hold anyone longer than
   <code>${CONFIG.walkOutAfter}m</code> past their booking and they walk out, which costs you outright.
   In those modes <b>Door calls</b> becomes the heaviest dimension at 22 points.`;

newNight();
</script>
